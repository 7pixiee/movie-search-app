<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nyxflix</title>
    <link rel="stylesheet" href="CSS/style.css">
</head>

<body>
    <div class="app">

        <aside class="sidebar">
            <div class="logo">
                Nyxflix
            </div>
            <hr>
            <nav class="sidebar-nav">
                <a href="index.html" class="nav-item active">
                    <span class="nav-icon">⌂</span>
                    <span>Home</span>
                </a>
                <a href="explore.html" class="nav-item">
                    <span class="nav-icon">⌕</span>
                    <span>Explore</span>
                </a>
                <a href="genres.html" class="nav-item">
                    <span class="nav-icon">❖</span>
                    <span>Genres</span>
                </a>
                <a href="favorites.html" class="nav-item">
                    <span class="nav-icon">♡</span>
                    <span>Favorites</span>
                </a>
            </nav>
            <hr>

        </aside>

        <main class="main-content">

            <header class="header">

                <div class="search-box">
                    <input type="text" placeholder="Search movie...">

                    <button>⌕</button>
                </div>

                <div class="header-actions">
                    <button>🕭</button>
                    <div class="profile">
                        <p>Pixie</p>
                    <img src="..\images\profile.jpg" alt="Profile">
                    </div>
                </div>
            </header>

            <section class="hero">

                <div class="hero-img">
                <div class="movie-info">
                    <h3 class="movie-name"></h3>
                    <p class="movie-genre"></p>
                </div>
                </div>
                
            </section>

            <section>
                <div class="section-header">
                    <h2>Popular Movies</h2>
                    <a href="explore.html" class="view-all">
                        View All
                    </a>
                </div>

                <div class="movie-grid" id="popular-movies">
                </div>

                <div class="section-header">
                    <h2>Latest Movies</h2>
                    <a href="explore.html" class="view-all">
                        View All
                    </a>
                </div>

                <div class="movie-grid" id="latest-movies">
                </div>

            </section>
        </main>

    </div>

    <script src="JS/home.js"></script>
</body>

</html>
