<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explore | Nyxflix</title>
    <link rel="stylesheet" href="CSS/style.css">
</head>

<body>
    <div class="app">

        <aside class="sidebar">
            <div class="logo">
                Nyxflix
            </div>
            <hr>
            <nav class="sidebar-nav">
                <a href="index.html" class="nav-item">
                    <span class="nav-icon">⌂</span>
                    <span>Home</span>
                </a>
                <a href="explore.html" class="nav-item active">
                    <span class="nav-icon">⌕</span>
                    <span>Explore</span>
                </a>
                <a href="genres.html" class="nav-item">
                    <span class="nav-icon">❖</span>
                    <span>Genres</span>
                </a>
                <a href="favorites.html" class="nav-item">
                    <span class="nav-icon">♡</span>
                    <span>Favorites</span>
                </a>
            </nav>
            <hr>

        </aside>

        <main class="main-content">

            <header class="header">

                <div class="search-box">
                    <input type="text"
                    id="movie-search"
                     placeholder="Search movie...">

                    <button>⌕</button>
                </div>

                <div class="header-actions">
                    <button>🕭</button>
                    <div class="profile">
                        <p>Pixie</p>
                        <img src="images/profile.jpg" alt="Profile">
                    </div>
                </div>
            </header>

            <section>
                <div class="header-section">
                    <h2>Explore</h2>

                    <div class="categories">
                        <div class="type">
                            <button class="btn" id="all-btn">All</button>
                            <button class="btn" id="movies-btn">Movies</button>
                            <button class="btn" id="series-btn">Series</button>
                        </div>

                        <div class="sortBy">

                            <div class="btn">
                                <select id="genre-dropdown">
                                    <option value="">Genre</option>
                                </select>
                            </div>

                            <div class="btn">
                                <select id="years-dropdown">
                                    <option value="">Years</option>
                                </select>
                            </div>

                            <div class="btn">
                                <select id="rating-dropdown">
                                    <option value="">Rating</option>
                                </select>
                            </div>

                        </div>
                    </div>
                </div>

                <div class="movie-grid" id="explore-movies">
                </div>

                <div class="footer-section">
                    <button class="backward btn">&lt;</button>
                    <button class="forward btn">&gt;</button>
                </div>
            </section>
        </main>
    </div>

    <script src="JS/explore.js"></script>

</body>

</html>
